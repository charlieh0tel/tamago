name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The goldens, and so the whole engine test suite, rest on the wasm nec2c
  # build agreeing with native nec2c. Nothing else exercises the native binary,
  # so this job is the evidence for that claim.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nec2c
        run: sudo apt-get update && sudo apt-get install -y nec2c

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No npm install: the harness imports only node builtins and the
      # committed prebuilt module.
      - name: Native vs wasm parity
        run: node web/wasm/smoke.mjs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Rebuild with the hash recorded at publish time so the output is
      # byte-comparable to the committed bundle.
      - name: Rebuild the app bundle
        run: >
          TAMAGO_GIT_HASH=$(node -p
          'JSON.parse(require("fs").readFileSync("../prebuilts/app/version.json","utf8")).hash')
          npm run build

      - name: Check prebuilts/app matches web/src
        run: |
          git status --porcelain -- ../prebuilts/app
          test -z "$(git status --porcelain -- ../prebuilts/app)"
