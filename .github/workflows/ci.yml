name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # nec2c drives the modeling tests; without it they would skip.
      - name: Install nec2c
        run: sudo apt-get update && sudo apt-get install -y nec2c

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Tests
        run: uv run python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Rebuild with the hash recorded at publish time so the output is
      # byte-comparable to the committed bundle.
      - name: Rebuild the app bundle
        run: >
          TAMAGO_GIT_HASH=$(node -p
          'JSON.parse(require("fs").readFileSync("../prebuilts/app/version.json","utf8")).hash')
          npm run build

      - name: Check prebuilts/app matches web/src
        run: |
          git status --porcelain -- ../prebuilts/app
          test -z "$(git status --porcelain -- ../prebuilts/app)"
