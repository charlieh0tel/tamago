[project]
name = "awadateki"
version = "0.3.0"
description = "Eggbeater antenna dimension generator with nec2c tuning"
requires-python = ">=3.11"
dependencies = []
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.urls]
Repository = "https://github.com/charlieh0tel/tamago"

[project.scripts]
awadateki = "awadateki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The nec2c sample output is a fixed-column fixture and must not be reflowed.
"tests/test_nec.py" = ["E501"]
# plot.py embeds an HTML/CSS template whose lines should not be reflowed.
"src/awadateki/plot.py" = ["E501"]
